{% extends "base.html" %}
{% block title %}Sign in - {{ app_name }}{% endblock %}
{% block auth_content %}
<div class="login-box">
    <div class="login-header">
        <h1>{{ app_name }}</h1>
        <p>Sign in to manage devices</p>
    </div>
    {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('auth.login') }}" class="login-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
        </div>
        <div class="form-group checkbox-group">
            <label><input type="checkbox" name="remember_me" value="y"> Keep me signed in</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
    </form>
</div>
{% endblock %}
