{% extends "base.html" %}

{% block title %}404 - {{ app_name }}{% endblock %}

{% block content %}
<section class="panel">
    <header class="panel-header">ERROR 404</header>
    <div class="panel-body">
        <h2 style="color: var(--accent-amber); margin-bottom: var(--space-lg);">PAGE NOT FOUND</h2>
        <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">{{ message }}</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn">RETURN TO CONTROL ROOM</a>
    </div>
</section>
{% endblock %}
