# A generic, single database configuration.

[alembic]
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to target path for 'script_location'
script_location = migrations

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the timezone used by Alembic to populate the revision_environment
# (supported types: [posix_tz_format, timezone, utc, offset, tz_expression])
timezone = UTC

# max length of characters to apply to the "slug" section
# truncate_slug_length = 40

# set to false to run the migrations in both databases
# if only a single database engine is used
# revision_environment = false

# set to false to store the type of revision id in the output
# can be used to make sure every migration file is written correctly
# pass = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
